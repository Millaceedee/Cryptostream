<script>
/* ===== Cryptostream Core JS ===== */
const CR = (() => {
'use strict';
const utf8 = s => new TextEncoder().encode(s);
const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
const unhex = h => Uint8Array.from(h.match(/../g).map(x => parseInt(x, 16)));
const rnd = n => { const a = new Uint8Array(n); globalThis.crypto.getRandomValues(a); return a; };
const rol32 = (x, n) => ((x << n) | (x >>> (32 - n))) >>> 0;

const xorb = (a, b) => a.map((x, i) => x ^ b[i]);

const SBOX = new Uint8Array(256);

  let p = 1, q = 1;

  do {
    p = (p ^ (p << 1) ^ ((p & 0x80) ? 0x1b : 0)) & 0xff;
    q ^= q << 1; q ^= q << 2; q ^= q << 4; q &= 0xff; if (q & 0x80) q ^= 0x09;

const xt = a => ((a << 1) ^ ((a & 0x80) ? 0x1b : 0)) & 0xff;
function aesKeyExp(key) {
  const Nk = key.length / 4, Nr = Nk + 6, w = new Uint8Array(16 * (Nr + 1));

const T = s => s.trim().split(/\s+/).map(Number);

let wl = 0; $('stage').addEventListener('wheel', e => { const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; if (Math.abs(d) < 8) return; e.preventDefault(); if (performance.now() - wl < 450) return; wl = performance.now(); go(cur + (d > 0 ? 1 : -1)); }, { passive: false });
let px = null; cv.addEventListener('pointerdown', e => { px = e.clientX; });
addEventListener('pointerup', e => { if (px == null) return; const dx = e.clientX - px; px = null; if (Math.abs(dx) > 70) go(cur + (dx < 0 ? 1 : -1)); });

function togglePause() { paused = !paused; $('pause').textContent = paused ? t('resume') : t('pause'); }
function setSpeed(v) { speed = Math.max(0.25, Math.min(4, v)); $('spd').value = speed; $('spdV').textContent = speed.toFixed(1) + '×'; }
$('pause').onclick = togglePause; $('spd').oninput = e => setSpeed(+e.target.value);
function toggleList() { $('list').classList.toggle('open'); }
$('listBtn').onclick = toggleList; $('list').addEventListener('click', e => { if (e.target === $('list') || e.target.id === 'listClose') $('list').classList.remove('open'); });

window.toggleLang = function() {
  currentLang = currentLang === 'en' ? 'fi' : 'en';
  localStorage.setItem('cryptostream_lang', currentLang);
  updateUILanguage();
  buildLanes();
};
$('langBtn').onclick = window.toggleLang;

function renderChipsAndCards() {
  $('chips').innerHTML = CIPHERS.map((c, i) => `<button style="--c:${c.color}" data-i="${i}"><b>${esc(localizedName(c))}</b><small>${esc(localizedYear(c))}</small></button>`).join('');

  $('cards').innerHTML = CIPHERS.map((c, i) =>
    `<button class="card" style="--c:${c.color}" data-i="${i}">
      <span class="n">${String(i + 1).padStart(2, '0')}</span>
      <h3>${esc(localizedName(c))}</h3>
      <p class="y">${esc(localizedYear(c))} · ${esc(localizedType(c))}</p>
      <div class="bars">${bars(c.strength, c.color)}</div>
      <p class="t">${esc(localizedTagline(c))}</p>
    </button>`
  ).join('');
}

function buildChipsAndCards() {
  renderChipsAndCards();
  $('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); });

  $('cards').addEventListener('click', e => {
    const b = e.target.closest('.card');
    if (b) {
      go(+b.dataset.i);
      $('list').classList.remove('open');
    }
  });
}

buildChipsAndCards();
updateUILanguage();

const h = (location.hash || '').slice(1), hi = CIPHERS.findIndex(c => c.id === h); cur = hi >= 0 ? hi : 0;
rgb = hexRgb(CIPHERS[cur].color); setInfo(); resize(); requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
